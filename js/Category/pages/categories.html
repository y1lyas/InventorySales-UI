<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - InventorySales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../../assets/css/main.css">
    <link rel="stylesheet" href="../../../assets/css/movement.css">
</head>
<body>
<div class="wrapper">
    <aside class="sidebar d-flex flex-column">
        <a href="/pages/" class="sidebar-brand fw-bold">
            <span>InventorySales</span>
            <i class="bi bi-house-door sidebar-brand-icon" aria-hidden="true"></i>
        </a>
        <nav class="nav flex-column sidebar-nav">
            <a href="../../Product/pages/movement.html" class="nav-link"><i class="bi bi-arrow-left-right me-2"></i>Movements</a>
            <a href="../../Product/pages/products.html" class="nav-link"><i class="bi bi-box-seam me-2"></i>Products</a>
            <a href="./categories.html" class="nav-link active"><i class="bi bi-tags me-2"></i>Categories</a>
            <a href="../../Sale/pages/sales.html" class="nav-link"><i class="bi bi-cart3 me-2"></i>Sales</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Categories</h2>
                <p class="text-muted small">Create categories and assign products to them.</p>
            </div>
        </header>

        <div id="category-alert" class="alert d-none" role="alert"></div>

        <div id="category-loading" class="text-center py-5 spinner">
            <div class="spinner-border mb-4 p-4" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="category-content" class="d-none">
            <div class="row g-4">
                <div class="col-lg-5">
                    <section class="card card-custom">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-3">Create Category</h5>
                            <form id="createCategoryForm">
                                <div class="mb-3">
                                    <label for="categoryName" class="form-label">Category Name</label>
                                    <input type="text" class="form-control" id="categoryName" required>
                                </div>
                                  <div class="mb-3">
                <label for="categoryDescription" class="form-label">Description</label>
                <textarea
                    class="form-control"
                    id="categoryDescription"
                    rows="3"
                    placeholder="Optional description..."
                ></textarea>
            </div>
                                <button type="submit" class="btn btn-primary">Create</button>
                            </form>
                        </div>
                    </section>

                    <section class="card card-custom mt-4">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-3">Current Categories</h5>
                            <ul id="category-list" class="list-group list-group-flush"></ul>
                            <div id="category-pagination-container" class="d-none border-top px-4 py-3">
                                <nav aria-label="Category pagination">
                                    <ul class="pagination justify-content-center mb-0" id="category-pagination"></ul>
                                </nav>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="col-lg-7">
                    <section class="card card-custom">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-3">Assign Product</h5>
                            <form id="assignCategoryForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="assignProduct" class="form-label">Product</label>
                                        <select id="assignProduct" class="form-select" required></select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="assignCategory" class="form-label">Category</label>
                                        <select id="assignCategory" class="form-select" required></select>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary">Assign</button>
                            </form>
                        </div>
                    </section>

                    <section class="card card-custom mt-4">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-3">Unassign Product</h5>
                            <form id="unassignCategoryForm">
                                <div class="mb-3">
                                    <label for="unassignProduct" class="form-label">Product</label>
                                    <select id="unassignProduct" class="form-select" required></select>
                                </div>
                                <button type="submit" class="btn btn-danger">Unassign</button>
                            </form>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../app.js"></script>
</html>
