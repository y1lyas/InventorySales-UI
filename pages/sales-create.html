<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Sale - InventorySales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/movement.css">
</head>
<body>
<div class="wrapper">
    <aside class="sidebar d-flex flex-column">
        <a href="/pages/" class="sidebar-brand fw-bold">
            <span>InventorySales</span>
            <i class="bi bi-house-door sidebar-brand-icon" aria-hidden="true"></i>
        </a>
        <nav class="nav flex-column sidebar-nav">
            <a href="/pages/movement.html" class="nav-link"><i class="bi bi-arrow-left-right me-2"></i>Movements</a>
            <a href="/pages/products.html" class="nav-link"><i class="bi bi-box-seam me-2"></i>Products</a>
            <a href="/pages/categories.html" class="nav-link"><i class="bi bi-tags me-2"></i>Categories</a>
            <a href="/pages/sales.html" class="nav-link"><i class="bi bi-cart3 me-2"></i>Sales</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Create Sale</h2>
                <p class="text-muted small">Select products, add quantities, and complete your sale.</p>
            </div>
            <a href="/pages/sales.html" class="btn btn-white bg-white border shadow-sm">
                <i class="bi bi-arrow-left me-2"></i>Back to Sales
            </a>
        </header>

        <div id="sale-create-error" class="alert alert-danger d-none" role="alert"></div>

        <div class="row g-4">
            <div class="col-lg-7">
                <section class="card card-custom">
                    <div class="card-body p-4">
                        <div class="d-flex flex-column flex-md-row align-items-start align-items-md-end justify-content-between gap-3 mb-4">
                            <h5 class="fw-bold mb-0">Product selection</h5>
                            <div class="input-group" style="min-width: 240px; max-width: 460px;">
                                <span class="input-group-text bg-white border-end-0">
                                    <i class="bi bi-search text-muted"></i>
                                </span>
                                <input type="search" id="sale-product-search" class="form-control border-start-0 ps-0" placeholder="Search products by name or SKU">
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table id="sale-product-table" class="table table-sm inventory-table mb-0 align-middle d-none">
                                <thead>
                                    <tr>
                                        <th>Product</th>
                                        <th>Stock</th>
                                        <th>Price</th>
                                        <th>Quantity</th>
                                        <th class="text-end">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="sale-product-table-body"></tbody>
                            </table>
                        </div>
                        <div id="sale-product-pagination-container" class="d-none border-top px-4 py-3">
                            <nav aria-label="Sale product pagination">
                                <ul class="pagination justify-content-center mb-0" id="sale-product-pagination"></ul>
                            </nav>
                        </div>
                    </div>
                </section>
            </div>
            <div class="col-lg-5">
                <section class="card card-custom">
                    <div class="card-body p-4 d-flex flex-column h-100">
                        <h5 class="fw-bold mb-3">Cart</h5>
                        <div class="table-responsive mb-3" style="min-height: 240px;">
                            <table class="table table-sm inventory-table mb-0 align-middle">
                                <thead>
                                    <tr>
                                        <th>Product</th>
                                        <th>Qty</th>
                                        <th>Unit</th>
                                        <th>Total</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="sale-cart-table-body"></tbody>
                            </table>
                            <div id="sale-cart-empty" class="text-center text-muted py-5">
                                <p class="mb-0">No products added to the cart yet.</p>
                            </div>
                        </div>
                        <div class="mt-auto">
                            <div class="d-flex justify-content-between mb-3">
                                <div class="text-muted">Total</div>
                                <div class="fs-5 fw-semibold">TRY <span id="sale-cart-total">0.00</span></div>
                            </div>
                            <button type="button" id="sale-submit-button" class="btn btn-primary w-100">Complete Sale</button>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/app.js"></script>
</body>
</html>
