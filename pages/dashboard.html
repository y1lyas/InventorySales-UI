<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - InventorySales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body>

<div class="wrapper">
    <aside class="sidebar d-flex flex-column">
        <h4 class="fw-bold mb-5 px-3">InventorySales</h4>
        <nav class="nav flex-column">
            <a href="dashboard.html" class="nav-link active"><i class="bi bi-grid-1x2 me-3"></i>Products</a>
            <a href="#" class="nav-link"><i class="bi bi-tags me-3"></i>Categories</a>
            <a href="#" class="nav-link"><i class="bi bi-cart3 me-3"></i>Sales</a>
            <hr class="my-4">
            <a href="index.html" class="nav-link"><i class="bi bi-house me-3"></i>Home</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Products</h2>
                <p class="text-muted small">Manage your inventory levels and catalog.</p>
            </div>
            <button class="btn btn-dark px-4 py-2 fw-semibold" id="btnAddProduct" onclick="showAddProductModal()">
                <i class="bi bi-plus-lg me-2"></i>Add Product
            </button>
        </header>

        <div class="mb-4" style="max-width: 420px;">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="search" id="product-search" class="form-control" placeholder="Search products by name or SKU">
            </div>
        </div>

        <div id="table-view" class="card card-custom overflow-hidden d-none">
            <table class="table mb-0 align-middle">
                <thead>
                    <tr>
                        <th class="px-4 py-3">Product Name</th>
                        <th>Category</th>
                        <th>Stock</th>
                        <th>Price</th>
                        <th>Created Date</th>
                        <th class="text-end px-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="product-list-body">
                    </tbody>
            </table>
            <div id="pagination-container" class="d-none border-top px-4 py-3">
                <nav aria-label="Product pagination">
                    <ul class="pagination justify-content-end mb-0" id="pagination"></ul>
                </nav>
            </div>
        </div>
        <div id="loading-state" class="text-center py-5">
            <div class="spinner-border mb-4 p-4" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <div id="empty-state" class="text-center d-none">
            <div class="mb-4 text-muted">
                <i class="bi bi-box-seam" style="font-size: 4rem;"></i>
            </div>
            <h4 id="empty-state-title" class="fw-bold">Your inventory is empty</h4>
            <p id="empty-state-text" class="text-muted mb-4">Start by adding your first product to manage your stock levels.</p>
            <button id="empty-state-button" class="btn btn-primary px-4 py-2" type="button">Create Your First Product</button>
        </div>
    </main>
</div>
<div class="modal fade" id="addProductModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">Add New Product</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="addProductForm">
                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" class="form-control" id="pName" required placeholder="e.g. iPhone 15 Pro">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" id="pCategory">
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">SKU</label>
                            <input type="text" class="form-control" id="pSku" required placeholder="SKU-123">
                        </div>
                    </div>
                    <div class="row align-items-end">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Price</label>
                            <div class="input-group">
                                <span class="input-group-text">TRY</span>
                                <input type="number" min="0.01" step="0.01" class="form-control" id="pPrice" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3 d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary py-2 px-4">Save Product</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/services/productService.js"></script>
    <script src="/js/views/dashboardView.js"></script>
    <script src="/js/views/addProductView.js"></script>
    <script src="/js/controllers/dashboardController.js"></script>
    <script src="/js/controllers/addProductController.js"></script>
    <script src="/js/dashboard/dashboard.js"></script>
    <script src="/js/modals/addProductModal.js"></script>
</body>
</html>
