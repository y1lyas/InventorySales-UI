<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - InventorySales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body>

<div class="wrapper">
    <aside class="sidebar d-flex flex-column">
        <h4 class="fw-bold mb-5 px-3">InventorySales</h4>
        <nav class="nav flex-column">
            <a href="dashboard.html" class="nav-link active"><i class="bi bi-grid-1x2 me-3"></i>Products</a>
            <a href="#" class="nav-link"><i class="bi bi-tags me-3"></i>Categories</a>
            <a href="#" class="nav-link"><i class="bi bi-cart3 me-3"></i>Sales</a>
            <hr class="my-4">
            <a href="index.html" class="nav-link"><i class="bi bi-house me-3"></i>Home</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h2 class="fw-bold mb-1">Products</h2>
                <p class="text-muted small">Manage your inventory levels and catalog.</p>
            </div>
            <button class="btn btn-dark px-4 py-2 fw-semibold" id="btnAddProduct">
                <i class="bi bi-plus-lg me-2"></i>Add Product
            </button>
        </header>

        <div id="table-view" class="card card-custom overflow-hidden">
            <table class="table mb-0 align-middle">
                <thead>
                    <tr>
                        <th class="px-4 py-3">Product Name</th>
                        <th>Category</th>
                        <th>Stock</th>
                        <th>Price</th>
                        <th>Created Date</th>
                        <th class="text-end px-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="product-list-body">
                    </tbody>
            </table>
        </div>
        <div id="empty-state" class="text-center">
            <div class="mb-4 text-muted">
                <i class="bi bi-box-seam" style="font-size: 4rem;"></i>
            </div>
            <h4 class="fw-bold">Your inventory is empty</h4>
            <p class="text-muted mb-4">Start by adding your first product to manage your stock levels.</p>
            <button class="btn btn-primary px-4 py-2" onclick="showAddProductModal()">Create Your First Product</button>
        </div>
    </main>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
