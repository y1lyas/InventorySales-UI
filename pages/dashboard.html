<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - InventorySales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
<div class="wrapper">
    <aside class="sidebar d-flex flex-column">
        <a href="/pages/" class="sidebar-brand fw-bold">
            <span>InventorySales</span>
            <i class="bi bi-house-door sidebar-brand-icon" aria-hidden="true"></i>
        </a>
        <nav class="nav flex-column sidebar-nav">
            <a href="/pages/dashboard.html" class="nav-link active"><i class="bi bi-grid-1x2 me-2"></i>Dashboard</a>
            <a href="/pages/products.html" class="nav-link"><i class="bi bi-box-seam me-2"></i>Products</a>
            <a href="#" class="nav-link"><i class="bi bi-tags me-2"></i>Categories</a>
            <a href="#" class="nav-link"><i class="bi bi-cart3 me-2"></i>Sales</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Dashboard</h2>
                <p class="text-muted small">Review stock movement history across your inventory.</p>
            </div>
        </header>

        <section class="d-flex flex-wrap gap-3 align-items-end mb-4">
            <div class="d-flex flex-grow-1" style="min-width: 280px; max-width: 500px;">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-search text-muted"></i>
                    </span>
                    <input type="search" id="dashboard-movement-search" class="form-control border-start-0 ps-0" placeholder="Search stock movements by name or SKU">
                    <select id="dashboard-movement-type-select" class="form-select" style="max-width: 170px;">
                        <option value="">All movements</option>
                        <option value="1">Increases</option>
                        <option value="2">Decreases</option>
                    </select>
                </div>
            </div>
            <div style="min-width: 240px; max-width: 420px;">
                <select id="dashboard-product-select" class="form-select">
                    <option value="">All products</option>
                </select>
            </div>
        </section>

        <section class="card card-custom overflow-hidden" id="stock-movement-card">
            <div class="table-responsive d-none" id="stock-movement-table">
                <table class="table table-sm stock-movements-table mb-0 align-middle">
                    <thead>
                        <tr>
                            <th class="px-4 py-3">Product</th>
                            <th>Date</th>
                            <th>Movement</th>
                            <th>Quantity</th>
                        </tr>
                    </thead>
                    <tbody id="stock-movement-table-body"></tbody>
                </table>
            </div>
            <div id="stock-movement-loading" class="text-center py-5 spinner">
                <div class="spinner-border mb-4 p-4" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            <div id="stock-movement-empty" class="text-center text-muted py-5 d-none">
                No stock movements found.
            </div>
            <div id="stock-movement-error" class="alert alert-danger m-4 d-none" role="alert"></div>
            <div id="stock-movement-pagination-container" class="d-none border-top px-4 py-3">
                <nav aria-label="Stock movement pagination">
                    <ul class="pagination justify-content-center mb-0" id="stock-movement-pagination"></ul>
                </nav>
            </div>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/app.js"></script>
</body>
</html>
