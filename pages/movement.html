<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movement - InventorySales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/movement.css">
</head>
<body>
<div class="wrapper">
    <aside class="sidebar d-flex flex-column">
        <a href="/pages/" class="sidebar-brand fw-bold">
            <span>InventorySales</span>
            <i class="bi bi-house-door sidebar-brand-icon" aria-hidden="true"></i>
        </a>
        <nav class="nav flex-column sidebar-nav">
            <a href="/pages/movement.html" class="nav-link active"><i class="bi bi-arrow-left-right me-2"></i>Movements</a>
            <a href="/pages/products.html" class="nav-link"><i class="bi bi-box-seam me-2"></i>Products</a>
            <a href="/pages/categories.html" class="nav-link"><i class="bi bi-tags me-2"></i>Categories</a>
            <a href="/pages/sales.html" class="nav-link"><i class="bi bi-cart3 me-2"></i>Sales</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold mb-1">Movements</h2>
                <p class="text-muted small">Review stock movement history across your inventory.</p>
            </div>
        </header>

        <section class="d-flex flex-wrap gap-3 align-items-center mb-4 mt-4">
            <div class="d-flex flex-grow-1" style="min-width: 280px; max-width: 500px;">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-search text-muted"></i>
                    </span>
                    <input type="search" id="movement-search" class="form-control border-start-0 ps-0" placeholder="Search movements by name or SKU">
                </div>
            </div>
            <div style="min-width: 240px; max-width: 420px;">
                <select id="movement-product-select" class="form-select searchable-select-native">
                    <option value="">All products</option>
                </select>
            </div>
            <span id="btnToggleMovementFilters" class="filter-toggle-link" role="button" tabindex="0">
                <i class="bi bi-sort-up me-1 " style="font-size: 20px;"></i>Filters
            </span>
        </section>

        <section id="movement-filter-panel" class="filter-panel card card-custom mb-4 d-none">
            <div class="card-body p-3">
                <div class="filter-row">
                    <div class="filter-field filter-field-select">
                        <label for="movement-type-select" class="form-label small text-muted">Movement</label>
                        <select id="movement-type-select" class="form-select">
                            <option value="">All movements</option>
                            <option value="1">Increases</option>
                            <option value="2">Decreases</option>
                        </select>
                    </div>
                    <div class="filter-field filter-field-select">
                        <label for="movement-filter-reason" class="form-label small text-muted">Reason</label>
                        <select id="movement-filter-reason" class="form-select">
                            <option value="">All reasons</option>
                            <option value="1">Sale</option>
                            <option value="2">Adjustment</option>
                        </select>
                    </div>
                    <div class="filter-field filter-field-date">
                        <label for="movement-filter-start-date" class="form-label small text-muted">Start Date</label>
                        <input type="date" id="movement-filter-start-date" class="form-control">
                    </div>
                    <div class="filter-field filter-field-date">
                        <label for="movement-filter-end-date" class="form-label small text-muted">End Date</label>
                        <input type="date" id="movement-filter-end-date" class="form-control">
                    </div>
                    <div class="filter-field filter-field-number">
                        <label for="movement-filter-min-quantity" class="form-label small text-muted">Min Quantity</label>
                        <input type="number" min="0" step="1" id="movement-filter-min-quantity" class="form-control" inputmode="numeric">
                    </div>
                    <div class="filter-field filter-field-number">
                        <label for="movement-filter-max-quantity" class="form-label small text-muted">Max Quantity</label>
                        <input type="number" min="0" step="1" id="movement-filter-max-quantity" class="form-control" inputmode="numeric">
                    </div>
                    <div class="filter-actions">
                        <button id="movement-filter-clear" type="button" class="btn btn-white bg-white border shadow-sm">Clear</button>
                        <button id="movement-filter-apply" type="button" class="btn btn-primary">Apply</button>
                    </div>
                </div>
            </div>
        </section>

        <div id="stock-movement-table" class="card card-custom overflow-hidden d-none">
            <table class="table table-sm inventory-table stock-movements-table mb-0 align-middle">
                <thead>
                    <tr>
                        <th class="px-4">Product</th>
                        <th>Reason</th>
                        <th>Date</th>
                        <th>Movement</th>
                        <th class="text-end px-4">Quantity</th>
                        <th class="text-end px-4">Related Sale</th>
                    </tr>
                </thead>
                <tbody id="stock-movement-table-body"></tbody>
            </table>
            <div id="stock-movement-pagination-container" class="d-none border-top px-4 py-3">
                <nav aria-label="Stock movement pagination">
                    <ul class="pagination justify-content-center mb-0" id="stock-movement-pagination"></ul>
                </nav>
            </div>
        </div>
        <div id="stock-movement-loading" class="text-center py-5 spinner">
            <div class="spinner-border mb-4 p-4" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        <div id="stock-movement-empty" class="text-center pt-4 d-none">
            <div class="mb-4 text-muted">
                <i class="bi bi-arrow-left-right" style="font-size: 4rem;"></i>
            </div>
            <h4 id="stock-movement-empty-title" class="fw-bold">No stock movements found</h4>
            <p id="stock-movement-empty-text" class="text-muted mb-4">Stock changes will appear here after inventory is adjusted.</p>
            <button id="stock-movement-empty-button" class="btn btn-primary px-4 py-2 d-none" type="button"></button>
        </div>
        <div id="stock-movement-error" class="alert alert-danger d-none" role="alert"></div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/app.js"></script>
</body>
</html>
